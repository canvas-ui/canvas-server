name: Update Submodules (dev)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: false
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # .gitmodules points at git@github.com:canvas-ui/... (SSH), so a deploy
      # key (or org-wide machine-user key) with read access to every
      # submodule repo must be stored as the SUBMODULES_DEPLOY_KEY secret.
      - name: Set up SSH for submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULES_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update submodules
        run: npm run update-submodules

      - name: Commit and push if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No submodule changes to push."
            exit 0
          fi
          git add -A
          git commit -m "chore: update submodules"
          git push origin HEAD:dev
