# Canvas Server — local container.
#
#   npm run docker:env     write a .env you can edit (host paths, admin, uid)
#   npm run docker:build
#   npm run docker:up      → http://localhost:8001
#   npm run docker:logs    admin password + API token are printed on first run
#
# Every value below comes from .env (see .env.example). The defaults keep all
# state inside ./data/ so `docker compose up` works with no .env at all.

services:
  canvas-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    image: canvas-server:latest
    container_name: ${CANVAS_CONTAINER_NAME:-canvas-server}

    # Run as the host user so bind-mounted directories (~/Workspaces …) are
    # writable and files land owned by you, not by root.
    user: "${CANVAS_UID:-1000}:${CANVAS_GID:-1000}"

    ports:
      - "${CANVAS_HOST_PORT:-8001}:8001"

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Bootstrap admin — created on first run, password + API token printed to
      # the log. CANVAS_ADMIN_RESET=true re-applies the password on next start.
      CANVAS_ADMIN_EMAIL: ${CANVAS_ADMIN_EMAIL:-admin@canvas.local}
      CANVAS_ADMIN_NAME: ${CANVAS_ADMIN_NAME:-}
      CANVAS_ADMIN_PASSWORD: ${CANVAS_ADMIN_PASSWORD:-}
      CANVAS_ADMIN_RESET: ${CANVAS_ADMIN_RESET:-false}

      # Container-internal roots (the mounts below put them on the host). User
      # homes are server runtime state, hence under the server home.
      CANVAS_SERVER_HOME: /opt/canvas-server/server
      CANVAS_USER_HOME: /opt/canvas-server/server/users

      # Per-user module roots are deliberately NOT pinned here. Left empty, every
      # user keeps the canonical layout
      #
      #     <serverHome>/users/<email>/{Workspaces,Roles,Agents}
      #
      # which is what makes a per-user ZFS dataset (or quota, or uid) possible:
      # one user's data is one subtree. Host folders are attached by mounting
      # them ONTO that subtree (see volumes below), not by moving the roots.
      #
      # Setting these collapses all users onto one shared directory — only ever
      # right for a single-user instance. Templates work too, e.g.
      # "{USER_HOME}/workspaces".
      CANVAS_USER_WORKSPACES: ${CANVAS_USER_WORKSPACES:-}
      CANVAS_USER_ROLES: ${CANVAS_USER_ROLES:-}
      CANVAS_USER_AGENTS: ${CANVAS_USER_AGENTS:-}

      # Folder structure for new workspaces. `home` — the workspace root IS the
      # user's drive, its runtime dirs hide in .workspace/ — is the default here
      # because the mounted folders above are ordinary directories: turning one
      # into a workspace, or syncing one through Dropbox/OneDrive, should not
      # scatter db/ and cache/ through the user's files. `full` for the classic
      # layout. Either way the picker in the web UI can override per workspace.
      CANVAS_WORKSPACE_LAYOUT: ${CANVAS_WORKSPACE_LAYOUT:-home}

      CANVAS_API_PORT: 8001
      CANVAS_WEB_PORT: 8001
      CANVAS_JWT_SECRET: ${CANVAS_JWT_SECRET:-}
      CANVAS_JWT_TOKEN_EXPIRY: ${CANVAS_JWT_TOKEN_EXPIRY:-7d}

      # Embedding service — CPU-local by default. Point OLLAMA_HOST at a
      # reachable Ollama (host.docker.internal / a LAN box) or disable it.
      CANVAS_EMBEDD_ENABLED: ${CANVAS_EMBEDD_ENABLED:-true}
      OLLAMA_HOST: ${OLLAMA_HOST:-}

    volumes:
      # Server state: config (incl. the generated jwt.secret), the index db,
      # caches. This is the dir you back up.
      - ${CANVAS_HOST_SERVER_HOME:-./data/server}:/opt/canvas-server/server
      # Per-user homes need no mount of their own: they live at
      # <serverHome>/users, inside the mount above.
      #
      # The three modules DO get their own mounts, attached inside the admin
      # user's home so the per-user structure is preserved — your $HOME/Workspaces
      # simply *is* users/<email>/Workspaces. Every other user's modules stay
      # inside the server-home mount, one subtree each.
      #
      # Create these host directories before the first `up`: docker creates a
      # missing bind source (and a missing mountpoint under the server-home
      # mount) as root, which the container user then cannot write into.
      # `npm run docker:install` / `npm run docker:env` do it for you.
      - ${CANVAS_HOST_WORKSPACES:-./data/server/users/admin@canvas.local/Workspaces}:/opt/canvas-server/server/users/${CANVAS_ADMIN_EMAIL:-admin@canvas.local}/Workspaces
      - ${CANVAS_HOST_ROLES:-./data/server/users/admin@canvas.local/Roles}:/opt/canvas-server/server/users/${CANVAS_ADMIN_EMAIL:-admin@canvas.local}/Roles
      - ${CANVAS_HOST_AGENTS:-./data/server/users/admin@canvas.local/Agents}:/opt/canvas-server/server/users/${CANVAS_ADMIN_EMAIL:-admin@canvas.local}/Agents

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/rest/v2/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
